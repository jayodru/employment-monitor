name: Weekly employment data refresh

# Runs every Monday at 11:00 UTC (early morning US), plus a manual button.
on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch: {}   # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write   # allows the job to commit the refreshed data.json

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the latest employment data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: python fetch_data.py

      - name: Commit refreshed data
        run: |
          git config user.name  "employment-monitor-bot"
          git config user.email "actions@github.com"
          git add data/data.json data/warn_last_good.json || true
          git commit -m "weekly data refresh: $(date -u +%Y-%m-%d)" || echo "no changes"
          git push || echo "nothing to push"
